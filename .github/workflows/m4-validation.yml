name: M4 validation run
on:
  push:
    branches: [codex/m4-validation-run]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-m4.txt
      - run: python -u run_m4_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-validation-results
          path: |
            results/
            models/ddqn_scripted.pt
