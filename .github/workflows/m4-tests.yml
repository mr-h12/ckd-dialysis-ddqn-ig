name: M4 attribution checks
on:
  pull_request:
    paths: ['xai_ig.py', 'test_xai_ig.py', 'requirements-m4.txt', '.github/workflows/m4-tests.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-m4.txt
      - run: python -m unittest -v test_xai_ig.py
      - run: python xai_ig.py --demo --sessions 2 --output results/xai_demo
      - uses: actions/upload-artifact@v4
        with:
          name: m4-demo-untrained
          path: results/xai_demo
